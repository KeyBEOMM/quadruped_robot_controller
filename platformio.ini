; PlatformIO Project Configuration File
;
; WiFi 크레덴셜은 secrets.ini에서 불러온다.
; secrets.ini는 .gitignore에 등록되어 GitHub에 올라가지 않는다.
; 처음 클론한 경우: secrets.ini.example을 복사하여 secrets.ini로 만들고 실제 값 입력

[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

build_flags =
    -D EIGEN_DONT_VECTORIZE
    -D EIGEN_DONT_ALIGN
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"

; ESP-IDF components required for Phase 2 (WiFi + UDP + NVS)
lib_deps =

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; =============================================================
; Phase 5: Calibration Mode (separate firmware)
; Build:  pio run -e esp32dev_calibration
; Flash:  pio run -e esp32dev_calibration -t upload
; Monitor: pio device monitor -b 115200
; =============================================================
[env:esp32dev_calibration]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

build_flags =
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    -D CALIBRATION_MODE=1